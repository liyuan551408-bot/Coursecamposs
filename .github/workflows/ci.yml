# @file Runs continuous integration checks for every branch push and pull request.

name: CourseCompass CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================================
  # Frontend
  # =========================================================
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # =========================================================
  # Backend static validation
  # =========================================================
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not configured."
            exit 1
          fi

          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET is not configured."
            exit 1
          fi

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Check backend JavaScript syntax
        working-directory: backend
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src scripts -type f -name '*.js' -print)


  # =========================================================
  # Integration / API connectivity
  # =========================================================
  api-smoke-test:
    name: API & service connectivity
    runs-on: ubuntu-latest

    needs:
      - backend

    env:
      NODE_ENV: test

      PORT: 3000

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate


      # -------------------------------------------------------
      # Database
      # -------------------------------------------------------
      - name: Test Supabase database connection
        working-directory: backend
        run: |
          node - <<'NODE'
          const prisma = require('./src/lib/prisma');

          async function test() {
            try {
              await prisma.$queryRaw`SELECT 1`;
              console.log('✅ Supabase database connection successful');
            } catch (error) {
              console.error('❌ Supabase database connection failed');
              console.error(error);
              process.exit(1);
            } finally {
              await prisma.$disconnect();
            }
          }

          test();
          NODE


      # -------------------------------------------------------
      # Start backend
      # -------------------------------------------------------
      - name: Start backend server
        working-directory: backend
        shell: bash
        run: |
          node app.js > server.log 2>&1 &
          echo $! > server.pid

          echo "Backend PID: $(cat server.pid)"


      # -------------------------------------------------------
      # Wait until Express starts
      # -------------------------------------------------------
      - name: Wait for backend server
        working-directory: backend
        shell: bash
        run: |
          for i in {1..30}; do

            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "✅ Backend server is running"
              exit 0
            fi

            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

          echo "❌ Backend failed to start"

          cat server.log

          exit 1


      # -------------------------------------------------------
      # Backend API routes
      # -------------------------------------------------------
      - name: Test backend APIs
        working-directory: backend
        run: node scripts/api.smoke.js


      # -------------------------------------------------------
      # External APIs
      # -------------------------------------------------------
      - name: Test external services
        working-directory: backend
        run: node scripts/external-services.smoke.js


      # -------------------------------------------------------
      # Show logs if something failed
      # -------------------------------------------------------
      - name: Show backend logs
        if: failure()
        working-directory: backend
        run: |
          echo "========== Backend logs =========="
          cat server.log || true


      # -------------------------------------------------------
      # Stop backend
      # -------------------------------------------------------
      - name: Stop backend
        if: always()
        working-directory: backend
        shell: bash
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
